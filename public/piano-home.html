<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yue Shi</title>
    <link rel="stylesheet" href="/css/piano-home.css" />
  </head>
  <body>
    <div class="app">
      <div class="notes-layer" id="notes-layer"></div>

      <section class="view home active" id="view-home" data-view="home">
        <div class="home-top">
          <button
            type="button"
            id="piano-sound-toggle"
            class="sound-toggle"
            aria-pressed="false"
            aria-label="Unmute piano sound"
          >
            <span class="sound-icon" aria-hidden="true">
              <svg
                viewBox="0 0 28 28"
                width="24"
                height="24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              >
                <path d="M12 20V6L21 4V17" />
                <ellipse
                  cx="8.5"
                  cy="20.5"
                  rx="3.5"
                  ry="2.5"
                  fill="currentColor"
                  stroke="none"
                />
                <ellipse
                  cx="17.5"
                  cy="17.5"
                  rx="3.5"
                  ry="2.5"
                  fill="currentColor"
                  stroke="none"
                />
                <path class="mute-slash" d="M4 25L25 3" stroke-width="2.1" />
              </svg>
            </span>
            <span class="sound-label">Sound off</span>
          </button>
        </div>

        <div class="home-center">
          <h1 class="hero-name">Yue Shi</h1>

          <div class="staves-wrap">
            <div
              class="music-staff research-score"
              aria-label="Research interests: four annotated notes"
            >
              <button
                class="identity-note"
                type="button"
                aria-label="Human–Computer Interaction"
                data-research="Human–Computer Interaction"
                style="--i: 0"
              >
                <svg viewBox="0 0 28 44" aria-hidden="true" focusable="false">
                  <ellipse
                    cx="10"
                    cy="33"
                    rx="7.5"
                    ry="5"
                    transform="rotate(-20 10 33)"
                    fill="currentColor"
                  />
                  <path
                    d="M16 31 V3"
                    stroke="currentColor"
                    stroke-width="2"
                  /></svg
                ><span class="short-label">HCI</span></button
              ><button
                class="identity-note"
                type="button"
                aria-label="Research Through Design"
                data-research="Research Through Design"
                style="--i: 1"
              >
                <svg viewBox="0 0 28 44" aria-hidden="true" focusable="false">
                  <ellipse
                    cx="10"
                    cy="33"
                    rx="7.5"
                    ry="5"
                    transform="rotate(-20 10 33)"
                    fill="currentColor"
                  />
                  <path
                    d="M16 31 V3"
                    stroke="currentColor"
                    stroke-width="2"
                  /></svg
                ><span class="short-label">RtD</span></button
              ><button
                class="identity-note"
                type="button"
                aria-label="Critical Making"
                data-research="Critical Making"
                style="--i: 2"
              >
                <svg viewBox="0 0 28 44" aria-hidden="true" focusable="false">
                  <ellipse
                    cx="10"
                    cy="33"
                    rx="7.5"
                    ry="5"
                    transform="rotate(-20 10 33)"
                    fill="currentColor"
                  />
                  <path
                    d="M16 31 V3"
                    stroke="currentColor"
                    stroke-width="2"
                  /></svg
                ><span class="short-label">Making</span></button
              ><button
                class="identity-note"
                type="button"
                aria-label="Animal–Computer Interaction"
                data-research="Animal–Computer Interaction"
                style="--i: 3"
              >
                <svg viewBox="0 0 28 44" aria-hidden="true" focusable="false">
                  <ellipse
                    cx="10"
                    cy="33"
                    rx="7.5"
                    ry="5"
                    transform="rotate(-20 10 33)"
                    fill="currentColor"
                  />
                  <path
                    d="M16 31 V3"
                    stroke="currentColor"
                    stroke-width="2"
                  /></svg
                ><span class="short-label">ACI</span>
              </button>
            </div>
          </div>
        </div>

        <div class="piano-shell" id="piano-shell">
          <div class="piano-toolbar">
            <div
              class="keyboard-nav"
              id="keyboard-nav"
              aria-label="Choose a section"
            >
              <button type="button" data-go="about">
                <span class="music-symbol">♪</span
                ><span class="nav-link-label">About Me</span>
              </button>
              <button type="button" data-go="projects">
                <span class="music-symbol">♪</span
                ><span class="nav-link-label">Projects</span>
              </button>
              <button type="button" data-go="experience">
                <span class="music-symbol">♪</span
                ><span class="nav-link-label">Experience</span>
              </button>
              <button type="button" data-go="life">
                <span class="music-symbol">♪</span
                ><span class="nav-link-label">Life</span>
              </button>
              <button type="button" data-go="contact">
                <span class="music-symbol">♪</span
                ><span class="nav-link-label">Contact</span>
              </button>
            </div>
          </div>
          <div class="piano" id="piano">
            <div
              class="keyboard-viewport"
              id="keyboard-viewport"
              aria-label="Scrollable piano keyboard: drag horizontally to explore all 88 keys"
            >
              <div class="keyboard-track" id="keyboard-track">
                <div class="white-keys" id="white-keys"></div>
              </div>
            </div>
          </div>
          <div class="piano-bottom-bar">
            <div class="keyboard-note" id="keyboard-note">
              Play a melody and get to know me ♪ Navigation on: marked notes
              open pages
            </div>
            <div class="piano-controls">
              <span
                class="mode-label sr-only"
                id="mode-status"
                aria-live="polite"
                >Navigation mode enabled</span
              ><button
                type="button"
                class="mode-toggle"
                id="mode-toggle"
                aria-pressed="true"
                aria-label="Switch to free play mode"
              >
                <span class="toggle-dot" aria-hidden="true"></span
                ><span class="toggle-text">Navigation on</span>
              </button>
            </div>
          </div>
        </div>

        <div class="home-footer">© 2026 Yue Shi</div>
      </section>
    </div>

    <script defer src="/js/piano-home.js"></script>
  </body>
</html>
